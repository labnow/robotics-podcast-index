[project]
name = "robotics-podcast-collection"
version = "0.1.0"
description = "Build and evolve a Xiaoyuzhou robotics episode corpus"
requires-python = ">=3.11"

[project.scripts]
robotcast = "robotcast.cli:main"

[project.optional-dependencies]
transcribe = ["openai-whisper>=20250625"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["robotcast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
